<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PL3 sans start_url">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<title>PL3 — preuve 0.7 (sans start_url)</title>
<style>
  :root { --fond: #f4f5f7; --surface: #fff; --texte: #1f2328; --doux: #5b6270; --ok: #1a7f37; --ko: #cf222e; --bord: #d0d7de; --accent: #1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #14171c; --surface: #1c2027; --texte: #e6e8eb; --doux: #9aa3b0; --ok: #3fb950; --ko: #f85149; --bord: #30363d; --accent: #4493f8; }
  }
  body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 16px; background: var(--fond); color: var(--texte); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  .carte { background: var(--surface); border: 1px solid var(--bord); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 0; vertical-align: top; overflow-wrap: anywhere; }
  td:first-child { color: var(--doux); padding-right: 12px; width: 45%; }
  .ok { color: var(--ok); font-weight: 600; } .ko { color: var(--ko); font-weight: 600; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte); margin: 4px 4px 4px 0; }
  #bandeau { display: none; background: var(--accent); color: #fff; border: 0; }
  #bandeau button { background: #fff; color: #1f2328; border: 0; }
</style>
</head>
<body>
<main>
  <h1>Preuve 0.7 — variante « sans start_url »</h1>
  <div class="carte" id="bandeau">Nouvelle version disponible. <button id="recharger">Mettre à jour</button></div>
  <div class="carte"><table id="etat"></table></div>
  <div class="carte">
    <button id="marquer">Écrire un marqueur ici</button>
    <button id="effacer">Effacer le marqueur</button>
    <button id="persister">Demander le stockage persistant</button>
  </div>
  <div class="carte" style="color: var(--doux)">
    Version de page : <strong>20260926-171123</strong>. Aucune donnée n'est envoyée nulle part : tout ce
    qui s'affiche est lu dans ce téléphone.
  </div>
</main>
<script>
const VERSION = '20260926-171123'
const etat = document.getElementById('etat')
const lignes = {}

function ligne(cle, libelle, valeur, ok) {
  if (!lignes[cle]) {
    const tr = document.createElement('tr')
    tr.innerHTML = `<td>${libelle}</td><td></td>`
    etat.appendChild(tr)
    lignes[cle] = tr.lastChild
  }
  lignes[cle].innerHTML = ok === undefined ? valeur : `<span class="${ok ? 'ok' : 'ko'}">${valeur}</span>`
}

const installee = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
ligne('contexte', 'Contexte', installee ? 'application installée (écran d\'accueil)' : 'navigateur (onglet)')
ligne('securise', 'Contexte sécurisé', window.isSecureContext ? 'oui' : 'NON', window.isSecureContext)
ligne('subtle', 'crypto.subtle', window.crypto && window.crypto.subtle ? 'disponible' : 'ABSENT', !!(window.crypto && window.crypto.subtle))
ligne('url', 'URL de lancement', location.href)

// Routage par fragment : ce que la PWA recevra d'un lien d'invitation.
function lireFragment() {
  const h = location.hash
  if (!h) return ligne('route', 'Fragment (#)', 'aucun', false)
  const [route, requete] = h.slice(1).split('?')
  const params = Object.fromEntries(new URLSearchParams(requete || ''))
  ligne('route', 'Fragment (#)', `route <strong>${route}</strong> — paramètres ${JSON.stringify(params)}`, true)
}
lireFragment()
window.addEventListener('hashchange', lireFragment)

// Stockage : partagé ou non entre l'onglet Safari et l'application installée ?
const CLE = 'pl3-preuve-07-marqueur'
function lireMarqueur() {
  const brut = localStorage.getItem(CLE)
  ligne('marqueur', 'Marqueur (localStorage)', brut ? `présent — écrit ${brut}` : 'absent')
}
document.getElementById('marquer').addEventListener('click', () => {
  localStorage.setItem(CLE, `depuis « ${installee ? 'application' : 'navigateur'} », variante sans start_url, le ${new Date().toLocaleString('fr-FR')}`)
  lireMarqueur()
})
document.getElementById('effacer').addEventListener('click', () => { localStorage.removeItem(CLE); lireMarqueur() })
lireMarqueur()

// persisted() ne fait que LIRE l'état ; seul persist() le DEMANDE (version D de la preuve).
function lirePersistance() {
  navigator.storage && navigator.storage.persisted && navigator.storage.persisted().then((p) =>
    ligne('persistant', 'Stockage persistant accordé', p ? 'oui' : 'non'))
  navigator.storage && navigator.storage.estimate && navigator.storage.estimate().then((e) =>
    ligne('quota', 'Quota estimé', `${Math.round((e.usage || 0) / 1024)} Kio utilisés sur ${Math.round((e.quota || 0) / 1048576)} Mio`))
}
lirePersistance()
document.getElementById('persister').addEventListener('click', async () => {
  if (!navigator.storage || !navigator.storage.persist) return ligne('demande', 'Demande de persistance', 'API absente', false)
  const accorde = await navigator.storage.persist()
  ligne('demande', 'Demande de persistance', accorde ? 'ACCORDÉE' : 'refusée', accorde)
  lirePersistance()
})

// Service worker : hors ligne et mise à jour forcée.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    ligne('sw', 'Service worker', 'enregistré', true)
    const signaler = () => { document.getElementById('bandeau').style.display = 'block' }
    if (reg.waiting && navigator.serviceWorker.controller) signaler()
    reg.addEventListener('updatefound', () => {
      const nouveau = reg.installing
      nouveau && nouveau.addEventListener('statechange', () => {
        if (nouveau.state === 'installed' && navigator.serviceWorker.controller) signaler()
      })
    })
    reg.update()  // vérification à chaque ouverture
    document.getElementById('recharger').addEventListener('click', () => {
      reg.waiting && reg.waiting.postMessage('activer')
    })
  }).catch((e) => ligne('sw', 'Service worker', 'échec : ' + e, false))
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload())
  navigator.serviceWorker.ready.then(() => ligne('swactif', 'Service worker actif', 'oui', true))
} else {
  ligne('sw', 'Service worker', 'non pris en charge', false)
}
ligne('enligne', 'Réseau', navigator.onLine ? 'en ligne' : 'HORS LIGNE')
</script>
</body>
</html>
